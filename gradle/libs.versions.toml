# =========================================================
#  Gradle Version Catalog — libs.versions.toml
#  Tất cả thư viện và phiên bản tập trung tại đây.
#  Chỉnh sửa phiên bản ở đây, Gradle sẽ áp dụng toàn project.
# =========================================================

[versions]
# Build Tools
agp             = "8.13.2"
kotlin          = "2.0.21"
ksp             = "2.0.21-1.0.28"

# AndroidX Core
coreKtx         = "1.15.0"
activityCompose = "1.10.0"

# Compose
composeBom      = "2024.12.01"
navigationCompose = "2.8.5"

# Lifecycle / ViewModel
lifecycleVersion = "2.8.7"

# Dependency Injection (Hilt)
hilt            = "2.52"
hiltExt         = "1.2.0"

# Database
room            = "2.6.1"
sqlcipher       = "4.5.4"
sqliteKtx       = "2.4.0"

# Health Connect
healthConnect = "1.1.0-alpha10"

# Camera & ML
cameraX         = "1.4.1"
mlkitLabeling   = "17.0.9"

# Background
workManager     = "2.10.0"

# Firebase (Optional — uncomment google-services plugin + google-services.json)
firebaseBom     = "33.8.0"

# Coroutines
coroutines      = "1.9.0"

# Widget
glance          = "1.1.1"

# Testing
junit           = "4.13.2"
androidxJunit   = "1.2.1"
espresso        = "3.6.1"
mockk           = "1.13.12"

# =========================================================
[libraries]
# AndroidX Core
androidx-core-ktx                   = { group = "androidx.core",         name = "core-ktx",                    version.ref = "coreKtx" }
androidx-activity-compose           = { group = "androidx.activity",     name = "activity-compose",            version.ref = "activityCompose" }

# Compose BOM (quản lý phiên bản toàn bộ Compose)
androidx-compose-bom                = { group = "androidx.compose",      name = "compose-bom",                 version.ref = "composeBom" }
androidx-ui                         = { group = "androidx.compose.ui",   name = "ui" }
androidx-ui-graphics                = { group = "androidx.compose.ui",   name = "ui-graphics" }
androidx-ui-tooling                 = { group = "androidx.compose.ui",   name = "ui-tooling" }
androidx-ui-tooling-preview         = { group = "androidx.compose.ui",   name = "ui-tooling-preview" }
androidx-material3                  = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended    = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose         = { group = "androidx.navigation",   name = "navigation-compose",          version.ref = "navigationCompose" }

# Lifecycle / ViewModel
androidx-lifecycle-runtime-ktx      = { group = "androidx.lifecycle",    name = "lifecycle-runtime-ktx",       version.ref = "lifecycleVersion" }
androidx-lifecycle-runtime-compose  = { group = "androidx.lifecycle",    name = "lifecycle-runtime-compose",   version.ref = "lifecycleVersion" }
androidx-lifecycle-viewmodel-compose= { group = "androidx.lifecycle",    name = "lifecycle-viewmodel-compose", version.ref = "lifecycleVersion" }

# Hilt DI
hilt-android                        = { group = "com.google.dagger",     name = "hilt-android",                version.ref = "hilt" }
hilt-android-compiler               = { group = "com.google.dagger",     name = "hilt-android-compiler",       version.ref = "hilt" }
hilt-navigation-compose             = { group = "androidx.hilt",         name = "hilt-navigation-compose",     version.ref = "hiltExt" }
hilt-work                           = { group = "androidx.hilt",         name = "hilt-work",                   version.ref = "hiltExt" }
hilt-compiler                       = { group = "androidx.hilt",         name = "hilt-compiler",               version.ref = "hiltExt" }

# Room + SQLCipher
androidx-room-runtime               = { group = "androidx.room",         name = "room-runtime",                version.ref = "room" }
androidx-room-compiler              = { group = "androidx.room",         name = "room-compiler",               version.ref = "room" }
androidx-room-ktx                   = { group = "androidx.room",         name = "room-ktx",                    version.ref = "room" }
androidx-room-testing               = { group = "androidx.room",         name = "room-testing",                version.ref = "room" }
sqlcipher-android                   = { group = "net.zetetic",           name = "android-database-sqlcipher",  version.ref = "sqlcipher" }
sqlite-ktx                          = { group = "androidx.sqlite",       name = "sqlite-ktx",                  version.ref = "sqliteKtx" }

# Health Connect
health-connect-client               = { group = "androidx.health.connect", name = "connect-client",            version.ref = "healthConnect" }

# CameraX
camerax-core                        = { group = "androidx.camera",       name = "camera-core",                 version.ref = "cameraX" }
camerax-camera2                     = { group = "androidx.camera",       name = "camera-camera2",              version.ref = "cameraX" }
camerax-lifecycle                   = { group = "androidx.camera",       name = "camera-lifecycle",            version.ref = "cameraX" }
camerax-view                        = { group = "androidx.camera",       name = "camera-view",                 version.ref = "cameraX" }
camerax-mlkit-vision                = { group = "androidx.camera",       name = "camera-mlkit-vision",         version.ref = "cameraX" }

# ML Kit
mlkit-image-labeling                = { group = "com.google.mlkit",      name = "image-labeling",              version.ref = "mlkitLabeling" }

# WorkManager
work-runtime-ktx                    = { group = "androidx.work",         name = "work-runtime-ktx",            version.ref = "workManager" }
work-testing                        = { group = "androidx.work",         name = "work-testing",                version.ref = "workManager" }

# Coroutines
kotlinx-coroutines-android          = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android",  version.ref = "coroutines" }
kotlinx-coroutines-test             = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test",     version.ref = "coroutines" }
kotlinx-coroutines-play-services    = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

# Glance Widget
androidx-glance-appwidget           = { group = "androidx.glance",       name = "glance-appwidget",            version.ref = "glance" }
androidx-glance-material3           = { group = "androidx.glance",       name = "glance-material3",            version.ref = "glance" }

# Firebase (Optional — bỏ comment khi đã có google-services.json)
# firebase-bom                      = { group = "com.google.firebase",   name = "firebase-bom",                version.ref = "firebaseBom" }
# firebase-firestore                = { group = "com.google.firebase",   name = "firebase-firestore-ktx" }
# firebase-auth                     = { group = "com.google.firebase",   name = "firebase-auth-ktx" }

# Testing
junit                               = { group = "junit",                 name = "junit",                       version.ref = "junit" }
androidx-junit                      = { group = "androidx.test.ext",     name = "junit",                       version.ref = "androidxJunit" }
androidx-espresso-core              = { group = "androidx.test.espresso", name = "espresso-core",              version.ref = "espresso" }
androidx-ui-test-manifest           = { group = "androidx.compose.ui",   name = "ui-test-manifest" }
androidx-ui-test-junit4             = { group = "androidx.compose.ui",   name = "ui-test-junit4" }
mockk                               = { group = "io.mockk",              name = "mockk",                       version.ref = "mockk" }

# =========================================================
[plugins]
android-application = { id = "com.android.application",          version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",      version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-ksp          = { id = "com.google.devtools.ksp",           version.ref = "ksp" }
hilt-android        = { id = "com.google.dagger.hilt.android",    version.ref = "hilt" }
# google-services   = { id = "com.google.gms.google-services",    version = "4.4.2" }
